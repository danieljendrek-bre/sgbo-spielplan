name: Spielplan von nuLiga holen

on:
  schedule:
    - cron: '17 * * * *'   # stündlich, jeweils um :17
  workflow_dispatch:        # zusätzlich per Knopfdruck startbar

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: nuLiga abrufen
        run: node sync.js
      - name: Geänderte Daten speichern
        run: |
          git config user.name "sgbo-spielplan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/spiele.json
          git diff --staged --quiet || (git commit -m "Spielplan aktualisiert" && git push)
